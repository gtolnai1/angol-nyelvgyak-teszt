<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angol Nyelvgyakorló</title>
    <!-- Tailwind CSS a gyönyörű dizájnhoz -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome az ikonokhoz -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js a formázott (Markdown) értékelés megjelenítéséhez -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        /* Egyedi stílusok az értékelés Markdown szövegéhez */
        #feedbackContent h2 { font-size: 1.5rem; font-weight: bold; margin-top: 1.5rem; color: #1e293b; }
        #feedbackContent h3 { font-size: 1.25rem; font-weight: bold; margin-top: 1rem; color: #334155; }
        #feedbackContent p { margin-bottom: 0.75rem; line-height: 1.6; }
        #feedbackContent strong { font-weight: 700; color: #0f172a; }
        #feedbackContent ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
        #feedbackContent li { margin-bottom: 0.5rem; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- 1. BEÁLLÍTÁSOK KÉPERNYŐ -->
    <div id="configScreen" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white max-w-md w-full p-8 rounded-2xl shadow-xl">
            <div class="flex justify-center mb-6">
                <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-3xl">
                    <i class="fa-solid fa-robot"></i>
                </div>
            </div>
            <h1 class="text-2xl font-bold text-center mb-2">Angol Nyelvgyakorló</h1>
            <p class="text-slate-500 text-center mb-6 text-sm">A használathoz szükség van a Gemini API kulcsodra.</p>
            
            <form id="configForm">
                <input 
                    type="password" 
                    id="apiKeyInput"
                    placeholder="Ide másold be a Gemini API kulcsot..."
                    class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4"
                    required
                />
                <button 
                    type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition-colors"
                >
                    Kezdődhet a gyakorlás!
                </button>
            </form>
        </div>
    </div>

    <!-- 2. CHAT KÉPERNYŐ -->
    <div id="chatScreen" class="hidden flex-1 flex flex-col h-full">
        <!-- Fejléc -->
        <header class="bg-white shadow-sm py-4 px-6 flex justify-between items-center z-10 flex-shrink-0">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-robot text-blue-600 text-2xl"></i>
                <h1 class="text-xl font-bold text-slate-800">Beszélgetés</h1>
            </div>
            <button 
                onclick="endConversation()"
                id="endButton"
                class="bg-red-50 hover:bg-red-100 text-red-600 font-medium py-2 px-4 rounded-lg flex items-center gap-2 transition-colors"
            >
                <i class="fa-solid fa-stop-circle"></i>
                <span class="hidden sm:inline">Beszélgetés vége & Értékelés</span>
                <span class="sm:hidden">Befejezés</span>
            </button>
        </header>

        <!-- Üzenetek -->
        <main id="chatBox" class="flex-1 overflow-y-auto p-4 md:p-6 w-full max-w-4xl mx-auto flex flex-col gap-4">
            <!-- Az üzenetek ide kerülnek beillesztésre -->
        </main>
        
        <!-- Gépelés indikátor (Rejtett alapból) -->
        <div id="typingIndicator" class="hidden max-w-4xl mx-auto w-full px-4 md:px-6 mb-4">
            <div class="flex justify-start">
                <div class="bg-white p-4 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 text-slate-500 flex gap-2 items-center">
                    <i class="fa-solid fa-circle-notch fa-spin"></i>
                    <span>A tanár gondolkodik...</span>
                </div>
            </div>
        </div>

        <!-- Kontroll panel -->
        <footer class="bg-white border-t border-slate-200 p-4 sm:p-6 pb-8 flex-shrink-0">
            <div class="max-w-4xl mx-auto flex flex-col items-center gap-4">
                <div class="flex items-center w-full gap-2">
                    <button
                        id="micButton"
                        onclick="toggleListen()"
                        class="flex-shrink-0 w-14 h-14 rounded-full flex items-center justify-center text-white transition-all shadow-lg bg-blue-600"
                    >
                        <i class="fa-solid fa-microphone text-xl"></i>
                    </button>
                    
                    <input 
                        type="text" 
                        id="messageInput"
                        placeholder="Kattints a mikrofonra, vagy gépelj ide..."
                        class="flex-1 bg-slate-100 border-none px-6 py-4 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 text-base sm:text-lg"
                    />

                    <button 
                        onclick="sendMessage()"
                        class="flex-shrink-0 w-14 h-14 bg-slate-800 text-white rounded-full flex items-center justify-center hover:bg-slate-700 transition-colors"
                    >
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
                <p id="micStatus" class="text-xs text-slate-400 mt-1">Kattints a mikrofon ikonra a beszédhez, vagy használd az Entert a küldéshez.</p>
            </div>
        </footer>
    </div>

    <!-- 3. ÉRTÉKELÉS KÉPERNYŐ -->
    <div id="feedbackScreen" class="hidden flex-1 overflow-y-auto bg-slate-50 p-4 font-sans text-slate-800">
        <div class="max-w-3xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-lg mt-8 mb-8">
            <h2 class="text-3xl font-bold text-slate-800 mb-6 flex items-center gap-3">
                <i class="fa-solid fa-circle-check text-green-500"></i>
                Gyakorlás Értékelése
            </h2>
            
            <div id="feedbackContent" class="text-slate-700">
                <!-- Visszajelzés ide töltődik -->
            </div>

            <button 
                onclick="restartApp()"
                class="mt-8 bg-blue-100 text-blue-700 hover:bg-blue-200 font-semibold py-3 px-6 rounded-lg transition-colors w-full sm:w-auto text-center"
            >
                Új beszélgetés indítása
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIKA -->
    <script>
        const API_MODEL = 'gemini-1.5-flash-latest';
        let apiKey = '';
        let conversation = [];
        let recognition = null;
        let isListening = false;

        // Képernyőváltás logikája
        function showScreen(screenId) {
            document.getElementById('configScreen').classList.add('hidden');
            document.getElementById('chatScreen').classList.add('hidden');
            document.getElementById('feedbackScreen').classList.add('hidden');
            
            document.getElementById(screenId).classList.remove('hidden');
            document.getElementById(screenId).classList.add('flex');
        }

        // Kezdés gomb
        document.getElementById('configForm').addEventListener('submit', (e) => {
            e.preventDefault();
            apiKey = document.getElementById('apiKeyInput').value.trim();
            if(apiKey.length > 10) {
                showScreen('chatScreen');
                const introText = "Hello! I'm your English practice partner. What would you like to talk about today?";
                addMessageToUI('model', introText);
                speakText(introText);
            }
        });

        // Beszédfelismerő inicializálása
        const SpeechRecognitionApi = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(SpeechRecognitionApi) {
            recognition = new SpeechRecognitionApi();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                let transcript = '';
                for(let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                document.getElementById('messageInput').value = transcript;
            };

            recognition.onend = () => {
                isListening = false;
                updateMicUI();
                
                // ÚJ: Automatikus küldés, ha befejezted a beszédet és van felismert szöveg
                if (document.getElementById('messageInput').value.trim() !== '') {
                    sendMessage();
                }
            };
            
            recognition.onerror = (event) => {
                console.error("Mikrofon hiba:", event.error);
                isListening = false;
                updateMicUI();
            };
        } else {
            document.getElementById('micButton').disabled = true;
            document.getElementById('micButton').classList.add('opacity-50', 'cursor-not-allowed');
            document.getElementById('micStatus').innerText = "A böngésződ nem támogatja a mikrofont. Kérlek gépelj!";
        }

        function toggleListen() {
            if(!recognition) return;
            
            if(isListening) {
                recognition.stop();
            } else {
                document.getElementById('messageInput').value = '';
                try {
                    recognition.start();
                    isListening = true;
                } catch(e) {
                    console.error("Nem sikerült elindítani a mikrofont", e);
                }
            }
            updateMicUI();
        }

        function updateMicUI() {
            const btn = document.getElementById('micButton');
            if(isListening) {
                btn.classList.remove('bg-blue-600');
                btn.classList.add('bg-red-500', 'animate-pulse');
                btn.innerHTML = '<i class="fa-solid fa-microphone-slash text-xl"></i>';
            } else {
                btn.classList.remove('bg-red-500', 'animate-pulse');
                btn.classList.add('bg-blue-600');
                btn.innerHTML = '<i class="fa-solid fa-microphone text-xl"></i>';
            }
        }

        // Enter gomb lekezelése a beviteli mezőn
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if(e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        function addMessageToUI(role, text) {
            conversation.push({ role, text });
            
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex w-full ${role === 'user' ? 'justify-end' : 'justify-start'}`;

            const innerDiv = document.createElement('div');
            innerDiv.className = `max-w-[85%] flex gap-3 ${role === 'user' ? 'flex-row-reverse' : 'flex-row'}`;

            const iconDiv = document.createElement('div');
            iconDiv.className = `flex-shrink-0 mt-1 w-8 h-8 rounded-full flex items-center justify-center text-white text-sm ${role === 'user' ? 'bg-blue-600' : 'bg-slate-400'}`;
            iconDiv.innerHTML = `<i class="fa-solid ${role === 'user' ? 'fa-user' : 'fa-robot'}"></i>`;

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = `p-4 rounded-2xl ${role === 'user' ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-white shadow-sm border border-slate-200 text-slate-800 rounded-tl-none'}`;
            
            const textP = document.createElement('p');
            textP.className = 'text-lg leading-relaxed';
            textP.innerText = text;
            bubbleDiv.appendChild(textP);

            if(role === 'model') {
                const playBtn = document.createElement('button');
                playBtn.className = "mt-3 flex items-center gap-2 text-sm text-slate-400 hover:text-blue-500 transition-colors";
                playBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i> Újra';
                playBtn.onclick = () => speakText(text);
                bubbleDiv.appendChild(playBtn);
            }

            innerDiv.appendChild(iconDiv);
            innerDiv.appendChild(bubbleDiv);
            msgDiv.appendChild(innerDiv);
            chatBox.appendChild(msgDiv);
            
            // Görgetés az aljára
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if(!text) return;

            input.value = '';
            if(isListening) toggleListen(); // Kikapcsoljuk a mikrofont küldéskor

            addMessageToUI('user', text);
            document.getElementById('typingIndicator').classList.remove('hidden');
            document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;

            // ÚJ: Szigorú ellenőrzés a Gemini API-hoz (váltakozó user/model szerepek biztosítása)
            let historyForApi = [];
            let expectedRole = 'user'; // Visszafelé építkezünk, a legutolsó üzenet biztosan 'user'
            
            for (let i = conversation.length - 1; i >= 0; i--) {
                if (conversation[i].role === expectedRole) {
                    historyForApi.unshift({
                        role: conversation[i].role,
                        parts: [{ text: conversation[i].text }]
                    });
                    expectedRole = expectedRole === 'user' ? 'model' : 'user';
                }
            }
            
            // Ha véletlenül 'model' üzenettel kezdődne a lista, azt eltávolítjuk
            if (historyForApi.length > 0 && historyForApi[0].role === 'model') {
                historyForApi.shift();
            }

            const systemInstruction = "You are a friendly English teacher having a casual spoken conversation with a student. Keep your answers short (1-3 sentences maximum) so it feels like a real chat. Use conversational English. DO NOT explicitly correct the student's grammar during this chat, just respond naturally to what they say. Your goal is to keep them talking.";

            try {
                let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${API_MODEL}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: historyForApi,
                        systemInstruction: { parts: [{ text: systemInstruction }] }
                    })
                });

                let data = await response.json();
                
                // ÚJ BIZTONSÁGI HÁLÓ: Ha az alap modell nem elérhető, próbáljuk meg a Pro verzióval
                if(data.error && (data.error.message.includes('not found') || data.error.message.includes('not supported'))) {
                    console.log("Flash modell nem elérhető, váltás a Gemini 1.5 Pro-ra...");
                    response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro-latest:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: historyForApi,
                            systemInstruction: { parts: [{ text: systemInstruction }] }
                        })
                    });
                    data = await response.json();
                }

                // Ha a Google szervere hibát küld
                if(data.error) {
                    throw new Error(data.error.message);
                }

                // Ha a biztonsági szűrő blokkolja a választ
                if(!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
                    throw new Error("A Google biztonsági szűrője blokkolta a választ.");
                }

                const aiText = data.candidates[0].content.parts[0].text;
                document.getElementById('typingIndicator').classList.add('hidden');
                addMessageToUI('model', aiText);
                speakText(aiText);

            } catch(error) {
                console.error("API Hiba:", error);
                document.getElementById('typingIndicator').classList.add('hidden');
                
                // MOST KIÍRJUK A NYERS HIBÁT A KÉPERNYŐRE
                const errorMsg = "Rendszerhiba: " + error.message;
                addMessageToUI('model', errorMsg);
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                
                const voices = window.speechSynthesis.getVoices();
                const englishVoice = voices.find(voice => voice.lang.includes('en-US') || voice.lang.includes('en-GB'));
                if (englishVoice) {
                    utterance.voice = englishVoice;
                }
                
                window.speechSynthesis.speak(utterance);
            }
        }

        async function endConversation() {
            if(conversation.length <= 1) return;
            
            window.speechSynthesis.cancel();
            showScreen('feedbackScreen');
            
            document.getElementById('feedbackContent').innerHTML = `
                <div class="flex items-center gap-3 text-blue-600 mb-8 mt-4">
                    <i class="fa-solid fa-circle-notch fa-spin text-2xl"></i>
                    <span class="font-medium text-lg">Beszélgetés elemzése és visszajelzés írása...</span>
                </div>`;

            const chatLog = conversation.map(msg => `${msg.role === 'user' ? 'Student' : 'Teacher'}: ${msg.text}`).join('\n');
            const prompt = `Itt egy angol nyelvű beszélgetés egy diák és egy tanár között:\n\n${chatLog}\n\nKérlek, vizsgáld meg a diák ("Student") mondatait. Írj egy barátságos, bátorító értékelést MAGYAR nyelven az alábbi struktúrában:\n1. Rövid dicséret (mi ment jól).\n2. Nyelvtani és szókincsbeli hibák javítása (idézd az eredeti mondatot, és mutasd meg a helyeset).\n3. 1-2 hasznos tipp a fejlődéshez.\n\nVálaszolj formázott Markdown szöveggel.`;

            try {
                let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${API_MODEL}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });
                
                let data = await response.json();

                // ÚJ BIZTONSÁGI HÁLÓ: Értékelésnél is váltunk, ha kell
                if(data.error && (data.error.message.includes('not found') || data.error.message.includes('not supported'))) {
                    response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro-latest:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }]
                        })
                    });
                    data = await response.json();
                }

                if(data.error) throw new Error(data.error.message);

                const feedbackText = data.candidates[0].content.parts[0].text;
                // Markdown szöveg átalakítása HTML-re a marked.js segítségével
                document.getElementById('feedbackContent').innerHTML = marked.parse(feedbackText);
                
            } catch(error) {
                console.error("Értékelés hiba:", error);
                document.getElementById('feedbackContent').innerHTML = `
                    <div class="bg-red-50 text-red-600 p-4 rounded-lg">
                        <p class="font-bold"><i class="fa-solid fa-triangle-exclamation"></i> Hiba történt</p>
                        <p>Sajnos nem sikerült elkészíteni az értékelést. Kérlek ellenőrizd az internetkapcsolatot.</p>
                    </div>`;
            }
        }

        function restartApp() {
            conversation = [];
            document.getElementById('chatBox').innerHTML = '';
            showScreen('chatScreen');
            const introText = "Hello again! Ready for another chat?";
            addMessageToUI('model', introText);
            speakText(introText);
        }

        // Böngésző hangjainak betöltése (kell a pontos akcentushoz)
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
        }
    </script>
</body>
</html>
